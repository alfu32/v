name: V Java package (macOS)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: macOS ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-x86_64
            runner: macos-13
          - target: macos-aarch64
            runner: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Pin V bootstrap dependencies
        shell: bash
        run: |
          git clone --filter=blob:none --quiet https://github.com/vlang/vc vc
          git -C vc checkout --quiet 089a309a1333507c7df4095129f01fe260041db6
          make latest_tcc
      - name: Build V native shared library
        shell: bash
        run: |
          make -j2 local=1
          mkdir -p "build/native/${{ matrix.target }}"
          echo "Starting native V payload build for ${{ matrix.target }}"
          time ./v -prod -shared -d jar \
            -o "build/native/${{ matrix.target }}/v.dylib" cmd/v
          test -s "build/native/${{ matrix.target }}/v.dylib"
          ls -lh "build/native/${{ matrix.target }}/v.dylib"
      - name: Build JNI bridge
        shell: bash
        run: |
          echo "Starting JNI bridge build for ${{ matrix.target }}"
          clang -dynamiclib \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/darwin" \
            -o "build/native/${{ matrix.target }}/v_jni.dylib" \
            tools/vjar/src/main/native/v_jni.c
          test -s "build/native/${{ matrix.target }}/v_jni.dylib"
          ls -lh "build/native/${{ matrix.target }}/v_jni.dylib"
      - name: Upload native payload
        uses: actions/upload-artifact@v4
        with:
          name: vjar-${{ matrix.target }}
          path: build/native/${{ matrix.target }}
          if-no-files-found: error
