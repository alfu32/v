name: V Java package (macOS)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: macOS ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-x86_64
            runner: macos-13
          - target: macos-aarch64
            runner: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build V and the JNI bridge
        shell: bash
        run: |
          make -j2
          mkdir -p "build/native/${{ matrix.target }}"
          ./v -prod -shared -d jar \
            -o "build/native/${{ matrix.target }}/v.dylib" cmd/v
          clang -dynamiclib \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/darwin" \
            -o "build/native/${{ matrix.target }}/v_jni.dylib" \
            tools/vjar/src/main/native/v_jni.c
      - name: Upload native payload
        uses: actions/upload-artifact@v4
        with:
          name: vjar-${{ matrix.target }}
          path: build/native/${{ matrix.target }}
          if-no-files-found: error
