name: V Java package (Linux)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Linux ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-22.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build V and the JNI bridge
        shell: bash
        run: |
          make -j2
          mkdir -p "build/native/${{ matrix.target }}"
          ./v -prod -shared -d jar \
            -o "build/native/${{ matrix.target }}/v.so" cmd/v
          cc -shared -fPIC \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -o "build/native/${{ matrix.target }}/v_jni.so" \
            tools/vjar/src/main/native/v_jni.c -ldl
      - name: Upload native payload
        uses: actions/upload-artifact@v4
        with:
          name: vjar-${{ matrix.target }}
          path: build/native/${{ matrix.target }}
          if-no-files-found: error
