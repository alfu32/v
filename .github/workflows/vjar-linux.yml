name: V Java package (Linux)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Linux ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-22.04
            timeout: 60
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            timeout: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Pin V bootstrap dependencies
        shell: bash
        run: |
          git clone --filter=blob:none --quiet https://github.com/vlang/vc vc
          git -C vc checkout --quiet 089a309a1333507c7df4095129f01fe260041db6
          make latest_tcc
      - name: Build V native shared library
        shell: bash
        run: |
          make -j2 local=1
          mkdir -p "build/native/${{ matrix.target }}"
          echo "Starting native V payload build for ${{ matrix.target }}"
          time ./v -prod -shared -d jar \
            -o "build/native/${{ matrix.target }}/v.so" cmd/v
          test -s "build/native/${{ matrix.target }}/v.so"
          ls -lh "build/native/${{ matrix.target }}/v.so"
      - name: Build JNI bridge
        shell: bash
        run: |
          echo "Starting JNI bridge build for ${{ matrix.target }}"
          cc -shared -fPIC \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -o "build/native/${{ matrix.target }}/v_jni.so" \
            tools/vjar/src/main/native/v_jni.c -ldl
          test -s "build/native/${{ matrix.target }}/v_jni.so"
          ls -lh "build/native/${{ matrix.target }}/v_jni.so"
          if test -f thirdparty/tcc/lib/libgc.a; then
            cp thirdparty/tcc/lib/libgc.a "build/native/${{ matrix.target }}/libgc.a"
          fi
      - name: Upload native payload
        uses: actions/upload-artifact@v4
        with:
          name: vjar-${{ matrix.target }}
          path: build/native/${{ matrix.target }}
          if-no-files-found: error
