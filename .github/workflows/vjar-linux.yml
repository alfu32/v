name: V Java package (Linux)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native:
    name: Linux ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-22.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build V and the JNI bridge
        shell: bash
        run: |
          make -j2
          mkdir -p "build/native/${{ matrix.target }}"
          ./v -prod -shared -d jar \
            -o "build/native/${{ matrix.target }}/v" cmd/v
          cc -shared -fPIC \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -o "build/native/${{ matrix.target }}/v_jni.so" \
            tools/vjar/src/main/native/v_jni.c -ldl
      - name: Upload native payload
        uses: actions/upload-artifact@v4
        with:
          name: vjar-${{ matrix.target }}
          path: build/native/${{ matrix.target }}
          if-no-files-found: error

  assemble:
    name: Assemble universal v.jar
    needs: native
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download Linux payloads
        uses: actions/download-artifact@v4
        with:
          name: vjar-linux-x86_64
          path: build/native/linux-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: vjar-linux-aarch64
          path: build/native/linux-aarch64
      - name: Locate matching macOS and Windows runs
        id: runs
        uses: actions/github-script@v7
        with:
          script: |
            const workflows = {
              macos: 'vjar-macos.yml',
              windows: 'vjar-windows.yml'
            };
            for (const [name, workflow_id] of Object.entries(workflows)) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                { owner: context.repo.owner, repo: context.repo.repo, workflow_id,
                  head_sha: context.sha, status: 'completed', per_page: 20 });
              const successful = runs.filter(run => run.conclusion === 'success');
              if (!successful.length) {
                core.setFailed(`No successful ${workflow_id} run exists for ${context.sha}.`);
                return;
              }
              core.setOutput(`${name}_run_id`, String(successful[0].id));
            }
      - name: Download macOS payloads
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.runs.outputs.macos_run_id }}
          name: vjar-macos-x86_64
          path: build/native/macos-x86_64
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.runs.outputs.macos_run_id }}
          name: vjar-macos-aarch64
          path: build/native/macos-aarch64
      - name: Download Windows payloads
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.runs.outputs.windows_run_id }}
          name: vjar-windows-x86_64
          path: build/native/windows-x86_64
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.runs.outputs.windows_run_id }}
          name: vjar-windows-aarch64
          path: build/native/windows-aarch64
      - name: Download TinyCC package
        shell: bash
        run: curl --fail --location --retry 3 \
          -o tcc-cli.jar \
          https://github.com/alfu32/tinycc/releases/latest/download/tinycc-cli.jar
      - name: Assemble v.jar
        shell: bash
        run: bash tools/vjar/assemble.sh build/native tcc-cli.jar v.jar
      - name: Upload universal v.jar
        uses: actions/upload-artifact@v4
        with:
          name: vjar-universal
          path: v.jar
          if-no-files-found: error
