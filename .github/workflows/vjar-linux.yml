name: V Java package - Linux

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  linux-native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-22.04
            cc: gcc
            extension: .so
          - target: linux-aarch64
            runner: ubuntu-22.04-arm
            cc: gcc
            extension: .so

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build V and the JNI bridge
        env:
          CC: ${{ matrix.cc }}
        run: |
          make -j2
          mkdir -p build/native/${{ matrix.target }}
          ./v -new-compiler -cc "$CC" -prod -shared -d jar \
            -o build/native/${{ matrix.target }}/v cmd/v
          "$CC" -shared -fPIC \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -Itools/vjar/src \
            -o build/native/${{ matrix.target }}/v_jni${{ matrix.extension }} \
            tools/vjar/src/v_jni.c -ldl

      - uses: actions/upload-artifact@v7
        with:
          name: vjar-${{ matrix.target }}
          path: build/native
          if-no-files-found: error

  package:
    name: Assemble universal v.jar
    needs: linux-native
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate macOS and Windows artifacts
        id: upstream
        uses: actions/github-script@v7
        with:
          script: |
            const workflowRuns = {
              macos: 'vjar-macos.yml',
              windows: 'vjar-windows.yml',
            };
            for (const [platform, workflow] of Object.entries(workflowRuns)) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow,
                head_sha: context.sha,
                per_page: 100,
              });
              const successful = response.data.workflow_runs
                .filter(run => run.conclusion === 'success')
                .sort((a, b) => Date.parse(b.updated_at) - Date.parse(a.updated_at));
              if (successful.length === 0) {
                throw new Error(
                  `No successful ${platform} workflow run found for commit ${context.sha}. ` +
                  `Run ${workflow} first, then rerun this workflow.`
                );
              }
              core.setOutput(`${platform}_run_id`, String(successful[0].id));
            }

      - uses: actions/download-artifact@v8
        with:
          pattern: vjar-linux-*
          path: build/native
          merge-multiple: true

      - name: Download macOS native artifacts
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.upstream.outputs.macos_run_id }}
          pattern: vjar-macos-*
          path: build/native
          merge-multiple: true

      - name: Download Windows native artifacts
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.upstream.outputs.windows_run_id }}
          pattern: vjar-windows-*
          path: build/native
          merge-multiple: true

      - name: Download the matching TCC runtime package
        run: curl --fail --location --retry 3 \
          -o build/tcc-cli.jar \
          https://github.com/alfu32/tinycc/releases/latest/download/tinycc-cli.jar

      - name: Compile the Java launcher
        run: |
          mkdir -p build/classes
          javac -d build/classes \
            tools/vjar/src/org/vlang/NativeMain.java \
            tools/vjar/src/org/vlang/cli/Main.java

      - name: Assemble v.jar
        run: |
          mkdir -p build/vroot
          cp -R vlib build/vroot/vlib
          mkdir -p build/vroot/thirdparty
          for path in thirdparty/*; do
            if [[ "$(basename "$path")" != "tcc" ]]; then
              cp -R "$path" build/vroot/thirdparty/
            fi
          done
          jar --create --file v.jar --main-class org.vlang.cli.Main \
            -C build/classes . \
            -C build vroot \
            -C build native \
            -C build tcc-cli.jar
          jar --describe-module --file v.jar || true
          test -s v.jar

      - name: Smoke-test the compiler and generated launcher
        run: |
          java -jar v.jar --version
          java -jar v.jar --package java -o build/hello.jar examples/hello_world.v
          java -jar build/hello.jar

      - uses: actions/upload-artifact@v7
        with:
          name: v.jar
          path: v.jar
          if-no-files-found: error
