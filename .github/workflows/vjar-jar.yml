name: V Java package (JAR assembly)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Commit or branch to use for the JAR sources'
        required: false
        type: string
      linux_run_id:
        description: 'Linux workflow run ID to reuse'
        required: false
        type: string
      macos_run_id:
        description: 'macOS workflow run ID to reuse for both architectures'
        required: false
        type: string
      macos_x86_64_run_id:
        description: 'macOS x86_64 workflow run ID override'
        required: false
        type: string
      macos_aarch64_run_id:
        description: 'macOS aarch64 workflow run ID override'
        required: false
        type: string
      windows_run_id:
        description: 'Windows workflow run ID to reuse'
        required: false
        type: string
  workflow_run:
    workflows:
      - V Java package (Linux)
      - V Java package (macOS)
      - V Java package (Windows)
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  assemble:
    name: Assemble available native payloads
    runs-on: ubuntu-22.04
    steps:
      - name: Select source commit
        id: commit
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          source_ref="$SOURCE_REF"
          if [ -z "$source_ref" ]; then
            source_ref="$WORKFLOW_SHA"
          fi
          echo "sha=$source_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Find completed OS workflow runs
        id: runs
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
          LINUX_RUN_ID: ${{ inputs.linux_run_id }}
          MACOS_RUN_ID: ${{ inputs.macos_run_id }}
          MACOS_X86_64_RUN_ID: ${{ inputs.macos_x86_64_run_id }}
          MACOS_AARCH64_RUN_ID: ${{ inputs.macos_aarch64_run_id }}
          WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
        with:
          script: |
            const workflows = {
              linux: 'vjar-linux.yml',
              macos: 'vjar-macos.yml',
              windows: 'vjar-windows.yml'
            };
            const requested = {
              linux: (process.env.LINUX_RUN_ID || '').trim(),
              macos: (process.env.MACOS_RUN_ID || '').trim(),
              macos_x86_64: (process.env.MACOS_X86_64_RUN_ID || '').trim(),
              macos_aarch64: (process.env.MACOS_AARCH64_RUN_ID || '').trim(),
              windows: (process.env.WINDOWS_RUN_ID || '').trim()
            };
            let completed = 0;
            for (const [name, workflow_id] of Object.entries(workflows)) {
              if (name === 'macos') {
                const selected = {};
                const macos_x86_64 = requested.macos_x86_64 || requested.macos;
                const macos_aarch64 = requested.macos_aarch64 || requested.macos;
                for (const [target, run_id_text] of Object.entries({
                  macos_x86_64,
                  macos_aarch64
                })) {
                  if (!run_id_text) continue;
                  const run_id = Number(run_id_text);
                  if (!Number.isSafeInteger(run_id) || run_id <= 0) {
                    throw new Error(`Invalid ${target} workflow run ID: ${run_id_text}`);
                  }
                  const run = await github.rest.actions.getWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id
                  });
                  if (!run.data.path.endsWith(workflow_id)) {
                    throw new Error(
                      `Run ${run_id} belongs to ${run.data.path}, not ${workflow_id}`
                    );
                  }
                  if (run.data.status !== 'completed') {
                    throw new Error(`Run ${run_id} for ${workflow_id} is not completed`);
                  }
                  selected[target] = run_id;
                  core.notice(
                    `Using explicitly selected ${target} run ${run_id} ` +
                    `(head ${run.data.head_sha}, conclusion ${run.data.conclusion})`
                  );
                }
                if (Object.keys(selected).length) {
                  if (selected.macos_x86_64) {
                    core.setOutput('macos_x86_64_run_id', String(selected.macos_x86_64));
                  }
                  if (selected.macos_aarch64) {
                    core.setOutput('macos_aarch64_run_id', String(selected.macos_aarch64));
                  }
                  completed += 1;
                  continue;
                }
              }
              if (requested[name]) {
                const run_id = Number(requested[name]);
                if (!Number.isSafeInteger(run_id) || run_id <= 0) {
                  throw new Error(`Invalid ${name} workflow run ID: ${requested[name]}`);
                }
                const selected = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id
                });
                if (!selected.data.path.endsWith(workflow_id)) {
                  throw new Error(
                    `Run ${run_id} belongs to ${selected.data.path}, not ${workflow_id}`
                  );
                }
                if (selected.data.status !== 'completed') {
                  throw new Error(`Run ${run_id} for ${workflow_id} is not completed`);
                }
                core.setOutput(`${name}_run_id`, String(run_id));
                core.notice(
                  `Using explicitly selected ${workflow_id} run ${run_id} ` +
                  `(head ${selected.data.head_sha}, conclusion ${selected.data.conclusion})`
                );
                completed += 1;
                continue;
              }
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                { owner: context.repo.owner, repo: context.repo.repo, workflow_id,
                  status: 'completed', per_page: 100 });
              const matching = runs.filter(run => run.head_sha === process.env.TARGET_SHA);
              if (matching.length) {
                if (name === 'macos') {
                  core.setOutput('macos_x86_64_run_id', String(matching[0].id));
                  core.setOutput('macos_aarch64_run_id', String(matching[0].id));
                } else {
                  core.setOutput(`${name}_run_id`, String(matching[0].id));
                }
                completed += 1;
              } else {
                core.warning(`No completed ${workflow_id} run for ${process.env.TARGET_SHA}`);
              }
            }
            const manual = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch';
            core.setOutput('ready', manual || completed === 3 ? 'true' : 'false');
            core.setOutput('completed', String(completed));
      - name: Wait for all OS workflows
        if: steps.runs.outputs.ready != 'true'
        run: echo "::notice::Waiting for all three OS workflows; completed ${{ steps.runs.outputs.completed }}/3."
      - name: Prepare native artifact directories
        if: steps.runs.outputs.ready == 'true'
        shell: bash
        run: mkdir -p build/native/{linux-x86_64,linux-aarch64,macos-x86_64,macos-aarch64,windows-x86_64,windows-aarch64}
      - name: Download Linux x86_64 payload
        if: steps.runs.outputs.ready == 'true' && steps.runs.outputs.linux_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.runs.outputs.linux_run_id }}
          name: vjar-linux-x86_64
          path: build/native/linux-x86_64
      - name: Download Linux aarch64 payload
        if: steps.runs.outputs.ready == 'true' && steps.runs.outputs.linux_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.runs.outputs.linux_run_id }}
          name: vjar-linux-aarch64
          path: build/native/linux-aarch64
      - name: Download macOS x86_64 payload
        if: steps.runs.outputs.ready == 'true' && steps.runs.outputs.macos_x86_64_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.runs.outputs.macos_x86_64_run_id }}
          name: vjar-macos-x86_64
          path: build/native/macos-x86_64
      - name: Download macOS aarch64 payload
        if: steps.runs.outputs.ready == 'true' && steps.runs.outputs.macos_aarch64_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.runs.outputs.macos_aarch64_run_id }}
          name: vjar-macos-aarch64
          path: build/native/macos-aarch64
      - name: Download Windows x86_64 payload
        if: steps.runs.outputs.ready == 'true' && steps.runs.outputs.windows_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.runs.outputs.windows_run_id }}
          name: vjar-windows-x86_64
          path: build/native/windows-x86_64
      - name: Download Windows aarch64 payload
        if: steps.runs.outputs.ready == 'true' && steps.runs.outputs.windows_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.runs.outputs.windows_run_id }}
          name: vjar-windows-aarch64
          path: build/native/windows-aarch64
      - name: Download TinyCC package
        if: steps.runs.outputs.ready == 'true'
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            -o tcc-cli.jar \
            https://github.com/alfu32/tinycc/releases/latest/download/tinycc-cli.jar \
            || echo 'warning: TinyCC package unavailable; assembling without it'
      - name: Report downloaded native payloads
        if: steps.runs.outputs.ready == 'true'
        shell: bash
        run: |
          echo 'Native files available for assembly:'
          find build/native -type f -print | sort || true
          native_count=$(find build/native -type f \( -name 'v.so' -o -name 'v.dylib' -o -name 'v.dll' \) | wc -l)
          if [ "$native_count" -eq 0 ]; then
            echo '::error::No native V payloads were downloaded. The OS workflows may not have uploaded artifacts yet.'
            exit 2
          fi
      - name: Assemble available payloads
        if: steps.runs.outputs.ready == 'true'
        shell: bash
        run: bash tools/vjar/assemble.sh build/native tcc-cli.jar v.jar
      - name: Upload universal v.jar
        if: steps.runs.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vjar-universal
          path: v.jar
          if-no-files-found: error
