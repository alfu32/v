name: V Java package (Windows)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Windows ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            runner: windows-2022
          - target: windows-aarch64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Pin V bootstrap dependencies
        shell: cmd
        run: |
          git clone --filter=blob:none --quiet https://github.com/vlang/vc vc
          git -C vc checkout --quiet 089a309a1333507c7df4095129f01fe260041db6
          git clone --filter=blob:none --quiet --branch thirdparty-windows-amd64 ^
            https://github.com/vlang/tccbin thirdparty\tcc
      - name: Build V and the JNI bridge
        shell: cmd
        run: |
          call makev.bat -msvc --local
          if errorlevel 1 exit /b %errorlevel%
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" ^
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 ^
            -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 -no_logo
          if errorlevel 1 exit /b %errorlevel%
          if not exist build\native\${{ matrix.target }} mkdir build\native\${{ matrix.target }}
          .\v.exe -prod -shared -d jar -cc msvc -o build\native\${{ matrix.target }}\v.dll cmd\v
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /LD /I"%JAVA_HOME%\include" /I"%JAVA_HOME%\include\win32" ^
            tools\vjar\src\main\native\v_jni.c ^
            /Fe:build\native\${{ matrix.target }}\v_jni.dll
          if exist thirdparty\tcc\lib\libgc.a copy /Y thirdparty\tcc\lib\libgc.a build\native\${{ matrix.target }}\libgc.a
      - name: Upload native payload
        uses: actions/upload-artifact@v4
        with:
          name: vjar-${{ matrix.target }}
          path: build/native/${{ matrix.target }}
          if-no-files-found: error
